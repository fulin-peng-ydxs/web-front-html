<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>永远爱你</title>

    <!-- 高级字体 -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital@1&display=swap" rel="stylesheet">

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: black;
            overflow: hidden;
        }

        canvas {
            display: block;
        }

        /* 底部文字 */
        .love-text {
            position: fixed;
            left: 50%;
            bottom: 26px;
            transform: translateX(-50%);

            font-size: 34px;
            font-family: "Cormorant Garamond", "Playfair Display", "Times New Roman", serif;
            font-style: italic;
            font-weight: 500;

            color: rgba(255, 255, 255, 0.96);
            letter-spacing: 8px;

            user-select: none;
            pointer-events: none;

            opacity: 0;

            animation:
                    textReveal 3.8s ease-out forwards,
                    textBreath 18s ease-in-out infinite 4s;
        }

        @keyframes textReveal {
            0% {
                opacity: 0;
                transform: translate(-50%, 14px);
                filter: blur(2.5px);
            }
            60% {
                opacity: 0.6;
                filter: blur(1px);
            }
            100% {
                opacity: 0.96;
                transform: translate(-50%, 0);
                filter: blur(0);
            }
        }

        @keyframes textBreath {
            0% {
                opacity: 0.9;
                transform: translateX(-50%) scale(1);
            }
            50% {
                opacity: 1;
                transform: translateX(-50%) scale(1.05);
            }
            100% {
                opacity: 0.9;
                transform: translateX(-50%) scale(1);
            }
        }
    </style>
</head>

<body>

<canvas id="canvas"></canvas>
<div class="love-text">I will love you forever, my princess.</div>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    let CANVAS_WIDTH = canvas.width = window.innerWidth;
    let CANVAS_HEIGHT = canvas.height = window.innerHeight;
    let CANVAS_CENTER_X = CANVAS_WIDTH / 2;
    let CANVAS_CENTER_Y = CANVAS_HEIGHT / 2;

    const BASE_IMAGE_ENLARGE = 22;
    const HEART_COLOR = "#db395f";
    const TOTAL_POINTS = 1500;

    function heartFunction(t, r = BASE_IMAGE_ENLARGE) {
        let x = 16 * Math.pow(Math.sin(t), 3);
        let y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
        return [
            x * r + CANVAS_CENTER_X,
            y * r + CANVAS_CENTER_Y
        ];
    }

    function scatterInside(x, y, beta = 0.15) {
        let rx = -beta * Math.log(Math.random());
        let ry = -beta * Math.log(Math.random());
        return [
            x - rx * (x - CANVAS_CENTER_X),
            y - ry * (y - CANVAS_CENTER_Y)
        ];
    }

    function shrink(x, y, ratio) {
        let force = -1 / Math.pow((x - CANVAS_CENTER_X) ** 2 + (y - CANVAS_CENTER_Y) ** 2, 0.6);
        return [
            x - force * ratio * (x - CANVAS_CENTER_X),
            y - force * ratio * (y - CANVAS_CENTER_Y)
        ];
    }

    function curve(p) {
        return 2 * (2 * Math.sin(4 * p)) / (2 * Math.PI);
    }

    class Heart {
        constructor(frames = 30) {
            this.frames = frames;
            this.points = [];
            this.edge = [];
            this.center = [];
            this.all = {};
            this.build(TOTAL_POINTS);
            for (let i = 0; i < frames; i++) this.calc(i);

            this.initParticles = this.all[0].map(([x, y, s]) => ({
                sx: CANVAS_CENTER_X + (Math.random() - 0.5) * CANVAS_WIDTH * 2,
                sy: CANVAS_CENTER_Y + (Math.random() - 0.5) * CANVAS_HEIGHT * 2,
                tx: x, ty: y, s
            }));
        }

        build(n) {
            for (let i = 0; i < n; i++) {
                this.points.push(heartFunction(Math.random() * Math.PI * 2));
            }
            this.points.forEach(p => {
                for (let i = 0; i < 2; i++) this.edge.push(scatterInside(p[0], p[1], 0.05));
            });
            for (let i = 0; i < 3000; i++) {
                let p = this.points[Math.random() * this.points.length | 0];
                this.center.push(scatterInside(p[0], p[1], 0.15));
            }
        }

        calcPos(x, y, ratio) {
            let f = 1 / Math.pow((x - CANVAS_CENTER_X) ** 2 + (y - CANVAS_CENTER_Y) ** 2, 0.52);
            return [
                x - ratio * f * (x - CANVAS_CENTER_X) + Math.random() * 2 - 1,
                y - ratio * f * (y - CANVAS_CENTER_Y) + Math.random() * 2 - 1
            ];
        }

        calc(frame) {
            let ratio = 6 * curve(frame / 10 * Math.PI);
            let pts = [];

            // 外部粒子层
            for (let i = 0; i < 1500; i++) {
                let [x, y] = heartFunction(Math.random() * Math.PI * 2, BASE_IMAGE_ENLARGE + 0.5);
                [x, y] = shrink(x, y, 6);
                pts.push([x + Math.random() * 30 - 15, y + Math.random() * 30 - 15, Math.random() > 0.5 ? 2 : 1]);
            }

            // 细腻小粒子层
            for (let i = 0; i < 800; i++) {
                let [x, y] = heartFunction(Math.random() * Math.PI * 2, BASE_IMAGE_ENLARGE - 1);
                pts.push([x + Math.random() * 15 - 7.5, y + Math.random() * 15 - 7.5, Math.random() * 1.2 + 0.5]);
            }

            [...this.points, ...this.edge, ...this.center].forEach(p => {
                let [x, y] = this.calcPos(p[0], p[1], ratio);
                pts.push([x, y, Math.random() * 2 + 1]);
            });

            this.all[frame] = pts;
        }

        render(frame, scale, progress) {
            let pts = this.all[Math.floor(frame % this.frames)];
            ctx.globalAlpha = progress;

            pts.forEach((p, i) => {
                let x, y, s;
                if (progress < 1) {
                    let ip = this.initParticles[i];
                    x = ip.sx * (1 - progress) + ip.tx * progress;
                    y = ip.sy * (1 - progress) + ip.ty * progress;
                    s = ip.s;
                } else {
                    [x, y, s] = p;
                }
                ctx.fillStyle = HEART_COLOR;
                ctx.fillRect(
                    CANVAS_CENTER_X + (x - CANVAS_CENTER_X) * scale,
                    CANVAS_CENTER_Y + (y - CANVAS_CENTER_Y) * scale,
                    s, s
                );
            });

            ctx.globalAlpha = 1;
        }
    }

    const heart = new Heart();
    let frame = 0;
    let progress = 0;

    function animate() {
        ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
        if (progress < 1) progress += 0.005;
        let scale = 1 + 0.18 * Math.sin(frame / 1500);
        heart.render(frame, scale, progress);
        if (progress >= 1) frame += 0.08;
        requestAnimationFrame(animate);
    }

    animate();
</script>
</body>
</html>
