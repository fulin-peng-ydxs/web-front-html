<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Symbol 创建对象属性</title>
</head>
<body>
    <script>
        //向对象中添加方法 up down
        let game = {
            name:'俄罗斯方块',
            up: function(){},
            down: function(){}
        };
        
        //声明一个对象
        // let methods = {
        //     up: Symbol(),
        //     down: Symbol()
        // };

        // game[methods.up] = function(){
        //     console.log("我可以改变形状");
        // }

        // game[methods.down] = function(){
        //     console.log("我可以快速下降!!");
        // }

        // console.log(game);

        //
        const say = Symbol('say');
        const zibao = Symbol('zibao');

        let youxi = {
            name: "狼人杀",
            [say]() {
                console.log("我可以发言");
            },
            [zibao]() {
                console.log("我可以自爆");
            }
        };

        // ✅ 直接调用
        youxi[say]();   // 输出：我可以发言
        youxi[zibao](); // 输出：我可以自爆

    </script>
</body>
</html>
